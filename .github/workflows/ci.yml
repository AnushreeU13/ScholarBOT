name: CI

on:
  push:
    branches: [skillup]
    paths:
      - "production_app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "production_app/**"
      - ".github/workflows/ci.yml"

jobs:
  backend:
    name: Backend tests (pytest, 80% coverage gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production_app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: production_app/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: production_app/backend/coverage.xml

  frontend:
    name: Frontend build (tsc, oxlint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production_app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: production_app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker image build smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f production_app/docker/Dockerfile.backend -t scholarbot-backend:ci production_app/backend

      - name: Build frontend image
        run: docker build -f production_app/docker/Dockerfile.frontend -t scholarbot-frontend:ci production_app/frontend
