# Local dev / demo stack. From production_app/:
#   docker compose -f docker/docker-compose.yml up --build
#
# Then migrate the existing KB into the backend's Chroma volume once, from the host:
#   docker compose -f docker/docker-compose.yml exec backend \
#     python scripts/migrate_to_chroma.py --guidelines /kb/guidelines_chunks_cleaned.jsonl \
#                                          --druglabels /kb/druglabels_chunks.jsonl
version: "3.9"

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    image: scholarbot-backend:local
    env_file:
      - .env
    environment:
      - CHROMA_PERSIST_DIR=/data/chroma
    volumes:
      - chroma_data:/data/chroma
      - ../../dataset:/kb:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    image: scholarbot-frontend:local
    environment:
      - BACKEND_HOST=backend:8000
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  chroma_data:
