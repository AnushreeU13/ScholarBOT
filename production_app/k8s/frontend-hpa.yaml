# The frontend is stateless (static assets + a reverse proxy), so it's the
# straightforward autoscaling target. Requires the metrics-server addon
# (`minikube addons enable metrics-server`).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scholarbot-frontend-hpa
  namespace: scholarbot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scholarbot-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
